name: Test suite

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * *"   # nightly at 08:00 WIB
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: UI + API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      outcome: ${{ steps.pytest.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        id: pytest
        continue-on-error: true   # always publish the report; the quality gate below decides pass/fail
        run: pytest

      - name: Build release-readiness report
        if: always()
        run: python tools/readiness_report.py reports/junit.xml --out reports/index.html --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 30

      - name: Package report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

  publish-report:
    name: Publish report
    needs: test
    if: always() && github.ref == 'refs/heads/main' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  quality-gate:
    name: Quality gate
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when tests failed
        run: |
          if [ "${{ needs.test.outputs.outcome }}" != "success" ]; then
            echo "::error::Test failures found. See the release-readiness report."
            exit 1
          fi
          echo "All exit criteria met."
