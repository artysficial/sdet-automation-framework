[pytest]
testpaths = tests
bdd_features_base_dir = tests/ui/features/
junit_family = xunit1
junit_suite_name = sdet-automation-framework
addopts =
    -ra
    --strict-markers
    -n 4
    --junitxml=reports/junit.xml
    --html=reports/detailed-report.html
    --self-contained-html

markers =
    ui: browser tests against the Sauce Demo storefront
    api: REST API tests (restful-booker, ParaBank, YouTube Data API)
    security: security checks against authorized test targets (see docs/SECURITY_TESTING.md)
    storefront: Sauce Demo storefront suite (selector for CI)
    booking: restful-booker Booking API suite (selector for CI)
    smoke: critical-path checks that gate every release
    regression: broader functional coverage
    negative: invalid input and error handling
    contract: response schema and status-code contract checks
    auth: sign-in and session behaviour
    catalog: product listing and sorting
    cart: basket behaviour
    checkout: order placement and price calculation
    banking: ParaBank online banking (UI and REST)
    youtube: YouTube Data API v3 (skips without an API key)
    injection: SQL-injection checks
    xss: cross-site-scripting checks
    authz: access-control and authentication checks
    reference_target: runs against an intentionally-vulnerable app (OWASP Juice Shop) to prove a detector works
    known_defect: reproduces a logged defect, expected to fail until fixed (see docs/DEFECTS.md)
